name: dem-handler
channels:
- conda-forge
- nodefaults
dependencies:
- gdal >=3.10.2
- rasterio >=1.4.3
- python >=3.8
- pip
- pip:
  - -e .
  - boto3>=1.37.1
  - geopandas>=1.0.1
  - requests>=2.32.3
  - aioboto3>=15.5.0, <16
  - scikit-image>=0.26.0, <0.27
  - multiprocess
  - pyogrio>=0.13.0, <0.14
  - pooch>=1.9.0, <2
  - tqdm>=4.70.0, <5
