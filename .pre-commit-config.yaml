repos:
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files", "--skip", ".pixi"]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
      - id: black
        args: ["--exclude", ".pixi"]
        language_version: python3.13
  - repo: local
    hooks:
    -   id: check-pixi-lock
        name: Check pixi.lock and update if different from manifest
        entry: ./hooks/check_pixi_lock.sh
        language: system
        verbose: false
        pass_filenames: false
    -   id: pixi-export-conda
        name: Pixi export conda environment.yaml      
        entry: ./hooks/export_conda.sh
        language: system
        verbose: false
        pass_filenames: false